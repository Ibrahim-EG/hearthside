<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Hearthside</title>
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden}
  canvas{display:block;width:100vw;height:100vh;touch-action:none}
  #boot{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
        color:#e8d7b0;font:14px/1.6 monospace;letter-spacing:.08em;
        background:#140d18;transition:opacity .8s;z-index:2;text-align:center;padding:0 24px}
  #boot.gone{opacity:0;pointer-events:none}
  *{-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
</style>
</head>
<body>
<canvas id="scene"></canvas>
<div id="boot">lighting the lantern…</div>
<script src="js/config.js"></script>
<script src="js/main.js"></script>
</body>
</html>
